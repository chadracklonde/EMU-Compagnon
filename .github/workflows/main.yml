name: Build APK

# Se déclenche à chaque push sur main, à chaque pull request, et peut aussi
# être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (release)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Vérifier l'environnement
        run: flutter doctor -v

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Générer les icônes de l'app
        run: dart run flutter_launcher_icons

      - name: Analyser le code (non bloquant)
        run: flutter analyze || true

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Construire l'App Bundle (pour le Play Store)
        run: flutter build appbundle --release

      # Rend l'APK téléchargeable depuis l'onglet "Actions" > ce run,
      # même sans créer de release GitHub.
      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publier l'App Bundle comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: emu-compagnon-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Crée automatiquement une Release GitHub avec l'APK attaché
  # quand tu pousses un tag de version, ex. : git tag v1.0.0 && git push --tags
  release:
    name: Créer une Release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Générer les icônes de l'app
        run: dart run flutter_launcher_icons

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Créer la Release avec l'APK attaché
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
